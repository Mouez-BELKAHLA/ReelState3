<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" role="img" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>ReelState Clean Architecture layers</title>
  <desc>A React frontend calls the API layer through a typed OpenAPI client. Four nested layers: API, Infrastructure, Application and Domain, with dependencies pointing inward.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="680" height="560" fill="#FFFFFF"/>

  <rect x="190" y="24" width="300" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="340" y="45" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#0C447C">React frontend</text>
  <text x="340" y="63" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">Typed client from OpenAPI spec</text>

  <line x1="340" y1="78" x2="340" y2="108" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="114" width="600" height="396" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="340" y="140" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#2C2C2A">API layer</text>
  <text x="340" y="159" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Controllers, middleware, DI setup</text>

  <rect x="70" y="180" width="540" height="300" rx="16" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="340" y="206" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#4A1B0C">Infrastructure layer</text>
  <text x="340" y="225" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">EF Core, identity, file storage, Gemini</text>

  <rect x="100" y="246" width="480" height="204" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="340" y="272" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#04342C">Application layer</text>
  <text x="340" y="291" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Use cases, interfaces, validators, DTOs</text>

  <rect x="150" y="314" width="380" height="104" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="340" y="345" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#26215C">Domain layer</text>
  <text x="340" y="368" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Entities and business rules</text>
  <text x="340" y="388" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">No outside dependencies</text>

  <text x="340" y="536" text-anchor="middle" dominant-baseline="central" font-size="12" font-style="italic" fill="#444441">Dependencies point inward: API → Infrastructure → Application → Domain</text>
</svg>
